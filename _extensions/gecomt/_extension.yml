title: Site do GECOMT
author: GECOMT/UFERSA
version: 1.0.0
quarto-required: ">=1.6.0"
# Estrutura inspirada na extensão "quartoorg" do repositório quarto-web:
# um tipo de projeto próprio que concentra tema, formato e opções do site.
contributes:
  formats:
    html:
      toc: true
      toc-title: "Nesta página"
      theme:
        light: [cosmo, scss/gecomt.scss]
        dark: [cosmo, scss/gecomt-dark.scss]
      code-copy: true
      code-overflow: wrap
      include-in-header:
        - assets/fonts.html
      include-after-body:
        - assets/scripts-posts.html
      grid:
        sidebar-width: 250px
        body-width: 860px
        margin-width: 300px
  project:
    project:
      type: website
    website:
      open-graph: true
      twitter-card: true
      page-navigation: true
      back-to-top-navigation: true
      search:
        show-item-context: true
        type: overlay
      navbar:
        background: primary
        logo: /assets/images/gecomt_emblema_transparente_fundo_escuro.svg
        logo-alt: "Emblema do GECOMT"
        title: "GECOMT"
        collapse-below: lg
    syntax-highlighting: a11y
    respect-user-color-scheme: true
    format: gecomt-html
