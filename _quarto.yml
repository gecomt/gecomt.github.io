project:
  type: gecomt
  # o GitHub Pages do repositório gecomt/gecomt.github.io publica a pasta docs/ da branch main
  output-dir: docs
  resources:
    - "assets/images/logos/*.svg"
    - "equipe/*.png"
    - ".nojekyll"
    - "dashboard/data/*"

lang: pt-BR

website:
  title: "GECOMT"
  description: "Blog do Grupo de Estudos sobre Contabilidade e Mercado de Trabalho (GECOMT/UFERSA)."
  site-url: https://gecomt.github.io
  favicon: assets/images/favicon.png
  google-analytics: "GTM-T9KC9QL7"
  image: assets/images/gecomt-og.png
  navbar:
    left:
      - text: "Início"
        href: index.qmd
      - text: "O grupo"
        href: sobre.qmd
      - text: "Equipe"
        href: equipe.qmd
      - text: "Produção"
        menu:
          - text: "Pacotes R"
          - text: "dataCAGED"
            href: pacotes/datacaged.qmd
          - text: "dataRAIS"
            href: pacotes/datarais.qmd
          - text: "---"
          - text: "Dados abertos (CAGED e RAIS)"
            href: producao.qmd#dados-abertos
          - text: "---"
          - text: "Projetos parceiros"
          - text: "contabiliDados"
            href: https://contabilidados.com.br/
            target: _blank
          - text: "Regulariza"
            href: https://regulariza.shinyapps.io/dashboard/
            target: _blank
          - text: "---"
          - text: "Ver toda a produção"
            href: producao.qmd
      - text: "Painel"
        href: dashboard/index.qmd
      - text: "Blog"
        href: blog/index.qmd
    tools:
      - icon: github
        href: https://github.com/gecomt
        aria-label: "GECOMT no GitHub"
      - icon: instagram
        href: https://instagram.com/gecomt.ufersa
        aria-label: "GECOMT no Instagram"
      - icon: twitter-x
        href: https://x.com/gecomt_ufersa
        aria-label: "GECOMT no X"
      - icon: youtube
        href: https://www.youtube.com/@gecomt
        aria-label: "GECOMT no YouTube"
      - icon: rss
        href: blog/index.xml
        aria-label: "Feed RSS do blog"
  page-footer:
    left: |
      [![](/assets/images/gecomt_emblema_transparente_fundo_escuro.svg){fig-alt="Emblema do GECOMT"}]{.footer-marca}
      © 2026 GECOMT · UFERSA, Mossoró/RN
    center:
      - text: "O grupo"
        href: sobre.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "UFERSA"
        href: https://ufersa.edu.br
      - text: "Ciências Contábeis"
        href: https://contabeis.ufersa.edu.br
      - text: "Contato"
        href: sobre.qmd#contato
    right:
      - icon: github
        href: https://github.com/gecomt
        aria-label: "GECOMT no GitHub"
      - icon: instagram
        href: https://instagram.com/gecomt.ufersa
        aria-label: "GECOMT no Instagram"
      - icon: youtube
        href: https://www.youtube.com/@gecomt
        aria-label: "GECOMT no YouTube"
      - icon: envelope
        href: mailto:gecomt@ufersa.edu.br
        aria-label: "E-mail do GECOMT"
      - icon: rss
        href: blog/index.xml
        aria-label: "Feed RSS do blog"

execute:
  freeze: auto
